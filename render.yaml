services:
  - type: web
    name: converttexture
    runtime: node
    plan: free
    buildCommand: echo "No dependencies"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: converttexture-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
